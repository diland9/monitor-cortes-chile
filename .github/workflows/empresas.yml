name: Datos por distribuidora

on:
  schedule:
    - cron: "10 * * * *"     # cada hora, minuto 10 (UTC). GitHub puede retrasar corridas.
  workflow_dispatch:

concurrency:
  group: empresas-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  empresas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install requests

      - name: Capturar ENEL, CGE y SAESA
        run: python empresas_scraper.py

      - name: Commit datos
        run: |
          git config user.name  "sec-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/empresas.json
          git diff --staged --quiet || git commit -m "empresas $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
